<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字动画背景测试 - YifanStudio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="minimal-cursor.css">
    <link rel="stylesheet" href="cleanest-transitions.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }
        
        .test-section {
            margin: 4rem 0;
            padding: 3rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .test-title {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .test-subtitle {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 3rem;
            text-align: center;
        }
        
        .text-test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }
        
        .text-test-item {
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
        }
        
        .text-test-item h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 400;
        }
        
        .text-test-item p {
            color: var(--text-light);
            line-height: 1.6;
        }
        
        .background-test {
            position: relative;
            height: 200px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2rem 0;
            overflow: hidden;
        }
        
        .background-test::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #111, #222, #111);
            z-index: -1;
        }
        
        .background-test h2 {
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-color);
        }
        
        .comparison-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin: 3rem 0;
        }
        
        .comparison-item {
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
        }
        
        .comparison-item h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            font-weight: 400;
        }
        
        .comparison-item p {
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-good {
            background: #4CAF50;
        }
        
        .status-bad {
            background: #f44336;
        }
        
        @media (max-width: 768px) {
            .comparison-section {
                grid-template-columns: 1fr;
            }
            
            .test-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body class="page-container">
    
        <section class="test-section">
            <h2 >背景色对比测试</h2>
            <div class="background-test">
                <h2 >页面背景色测试区域</h2>
            </div>
            <p style="text-align: center; color: var(--text-light);">
                上方区域展示了页面的实际背景色，下方文字动画应该与此完全匹配
            </p>
        </section>

        
        <section class="test-section">
            <h2 >修复前后对比</h2>
            <div class="comparison-section">
                <div class="comparison-item">
                    <h3>修复前的问题</h3>
                    <p><span class="status-indicator status-bad"></span>文字动画背景色不匹配</p>
                    <p><span class="status-indicator status-bad"></span>出现黑色条状背景</p>
                    <p><span class="status-indicator status-bad"></span>与灰色页面背景违和</p>
                    <p><span class="status-indicator status-bad"></span>影响视觉体验</p>
                </div>
                
                <div class="comparison-item">
                    <h3>修复后的效果</h3>
                    <p><span class="status-indicator status-good"></span>文字动画背景色完全匹配</p>
                    <p><span class="status-indicator status-good"></span>消除黑色条状背景</p>
                    <p><span class="status-indicator status-good"></span>与页面背景完美融合</p>
                    <p><span class="status-indicator status-good"></span>提供流畅视觉体验</p>
                </div>
            </div>
        </section>

        
        <section class="test-section">
            <h2 >导航测试</h2>
            <div style="text-align: center; margin: 2rem 0;">
                <a href="clean-test.html" class="nav-link nav-link-transition" style="margin: 0 1rem;">返回测试页面</a>
                <a href="index.html" class="nav-link nav-link-transition" style="margin: 0 1rem;">返回主页</a>
                <a href="gallery.html" class="nav-link nav-link-transition" style="margin: 0 1rem;">查看画廊</a>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="mailto:yzhao09@risd.edu">EMAIL</a>
                <a href="https://www.linkedin.com/in/yifan-zhao-bb7b652b6" target="_blank">LINKEDIN</a>
                <a href="resume.pdf" download>RESUME</a>
            </div>
            <p class="footer-text">© 2025 YiFanStudio. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
    <script src="cleanest-transitions.js"></script>
    <script src="minimal-cursor.js"></script>
</body>
</html>
